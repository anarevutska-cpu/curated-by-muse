name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check seed.js
          node --check netlify/functions/product.js
          node --check netlify/functions/fx.js

      - name: Check inline JavaScript syntax
        run: node scripts/check-inline-js.cjs

      - name: Run unit tests
        run: node --test tests/*.test.cjs
